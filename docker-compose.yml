services:
  db:
    image: postgres:16-alpine
    container_name: familyhome-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: familyhome
      POSTGRES_USER: familyhome
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - familyhome-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyhome"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: familyhome-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://familyhome:${POSTGRES_PASSWORD}@db:5432/familyhome
      NEXT_PUBLIC_BASE_URL: https://familyhomeprotaras.yiangouweb.com
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SITE_NAME: Family Home Protaras
      CONTACT_EMAIL: familyhome@yiangouweb.com
      CONTACT_PHONE: ${CONTACT_PHONE}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      ICAL_TOKEN: ${ICAL_TOKEN}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    ports:
      - "3031:3031"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - familyhome-net

networks:
  familyhome-net:
    driver: bridge
