services:
  db:
    image: postgres:16-alpine
    container_name: familyhome-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: familyhome
      POSTGRES_USER: familyhome
      POSTGRES_PASSWORD: FamilyHome123!
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - familyhome-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyhome"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: familyhome-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://familyhome:FamilyHome123!@db:5432/familyhome
      NEXT_PUBLIC_BASE_URL: https://familyhome.yiangouweb.com
      ADMIN_PASSWORD: FamilyHome2024!
      SITE_NAME: Family Home Protaras
      CONTACT_EMAIL: yiannis@yiangouweb.com
      CONTACT_PHONE: +357XXXXXXXX
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
    ports:
      - "3030:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - familyhome-net

networks:
  familyhome-net:
    driver: bridge
